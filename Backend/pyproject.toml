[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for AI RAG app"
authors = [
    { name = "shriya", email = "docshriya@gmail.com" }
]
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "python-decouple (>=3.8,<4.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false